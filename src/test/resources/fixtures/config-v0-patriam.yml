# #Plugin configuration
tag: '&cSystem &8>> '
lang: en_EN
log: true
save-interval: 300
save-log: true
send-player-messages: true
antispam-tick: 5
# # Protection module
protections:
  container: true # Bypass : creativemanager.container
  spawn: true # Bypass : creativemanager.spawner
  drop: true # Bypass : creativemanager.drop
  pickup: true # Bypass : creativemanager.pickup
  build: false # Bypass : creativemanager.build
  entity: true # Bypass : creativemanager.entity
  pvp: true # Bypass : creativemanager.hit.player
  pve: true # Bypass : creativemanager.hit.monster
  lore: true # Bypass : creativemanager.bypass.lore
  loot: true
  spawn-build: false
  throw: true
  commands: true
  useblock: true
  blockcopy: false
  gui: true
  custom-nbt: true
  armor: true
  plugins:
    citizens: true
    chestshop: true
    slimefun: true
# # Multi inventory
inventory:
  adventure: true # Bypass : cm.bypass.inventory
  creative: true # Bypass : cm.bypass.inventory
  spectator: true # Bypass : cm.bypass.inventory
stop-inventory-save: false # Use it at your own risk, this option fully disable the inventory save system.
# # Black List
blacklist:
  place: # Bypass : creativemanager.bypass.blacklist.place
    - bedrock
    - netherite_block
    - diamond_block
    - gold_block
    - iron_block
    - coal_block
    - glowstone
    - raw_gold_block
    - raw_iron_block
    - repeater
    - comparator
    - enchanting_table
    - end_crystal
  use: # Bypass : creativemanager.bypass.blacklist.use
    - lava_bucket
    - fire_charge
    - splash_potion
    - potion
    - enchanting_table
    - armor_stand
  get: # Bypass : creativemanager.bypass.blacklist.get
    - netherite
    - emerald
    - diamond
    - gold_ingot
    - iron_ingot
    - coal
    - lapis_lazuli
    - redstone
    - emerald_ore
    - diamond_ore
    - gold_ore
    - iron_ore
    - coal_ore
    - quartz
    - deepslate_diamond_ore
    - deepslate_gold_ore
    - deepslate_iron_ore
    - deepslate_coal_ore
    - golden_apple
    - enchanted_golden_apple
    - repeater
    - comparator
    - enchanting_table
    - end_crystal
  break:
  - bedrock
  commands:
  - shop
  - backpack
  - bp
  - coinpurse
  useblock:
  - CRAFTING_TABLE
  - CHEST
creative_armor:
  helmet:
    name: '&6Creative Helmet'
    lore:
    - '&7This creative Helmet is bound to your Gamemode !'
    material: BEDROCK
    model-data: 0
    items-adder: ''
  chestplate:
    name: '&6Creative Chestplate'
    lore:
    - '&7This &6Creative Chestplate&7 is bound to your Gamemode !'
    material: LEATHER_CHESTPLATE
    leather-color:
      red: 255
      green: 0
      blue: 0
    model-data: 0
    items-adder: ''
  leggings:
    name: '&6Creative Leggings'
    lore:
    - '&7This &6Creative Leggings&7 is bound to your Gamemode !'
    material: LEATHER_LEGGINGS
    leather-color:
      red: 255
      green: 0
      blue: 0
    model-data: 0
    items-adder: ''
  boots:
    name: '&6Creative Boots'
    lore:
    - '&7This &6Creative Boots&7 is bound to your Gamemode !'
    material: LEATHER_BOOTS
    leather-color:
      red: 255
      green: 0
      blue: 0
    model-data: 0
    items-adder: ''
# # Lore settings
creative-lore:
- '&5Creative {ITEM}'
- '&7Generated by {PLAYER}'
- '&7{UUID}'
